name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Install browser acceptance runtime
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Run dashboard browser acceptance
        run: YEN_DASHBOARD_BROWSER=chromium go test ./internal/adapters -run TestDashboardBrowserAcceptance -count=1
      - name: Run live terminal acceptance
        run: YEN_LIVE_TERMINAL_ACCEPTANCE=1 go test ./internal/tui -run TestLiveTerminal -count=1
      - name: Check diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff --check HEAD^...HEAD
          fi
